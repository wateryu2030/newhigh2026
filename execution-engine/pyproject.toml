[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-engine"
version = "0.2.0"
description = "Order execution engine for newhigh — signal-to-order pipeline with risk checks"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
